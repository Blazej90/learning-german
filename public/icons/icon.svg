<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Source of every PNG icon in this folder and in src/app.
       Two flashcards, the front one turned over. Drawn as plain geometry so
       it survives being scaled down to 32 px and cropped to a circle by
       Android's maskable mask — everything stays inside the middle 80%.

       Colours are the app's own tokens: deep ink for the ground, the warm
       off-white of the card face, and one amber line as the accent. Regenerate
       the PNGs after editing this file. -->
  <rect width="512" height="512" fill="#091b31"/>
  <g transform="rotate(-9 238 256)">
    <rect x="148" y="131" width="180" height="250" rx="22" fill="#334f6d"/>
  </g>
  <g transform="rotate(6 274 256)">
    <rect x="184" y="131" width="180" height="250" rx="22" fill="#fbfaf7"/>
    <rect x="212" y="286" width="124" height="18" rx="9" fill="#9da5b1"/>
    <rect x="212" y="320" width="76" height="18" rx="9" fill="#e49e22"/>
  </g>
</svg>
